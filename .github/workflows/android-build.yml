name: Android Build

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - ':app:assembleNightly'
          - ':app:assembleClone'
          - ':app:bundleRelease'
  push:
    branches: [main]
    paths:
      - .github/workflows/android-build.yml
      - .gitmodules
      - .npmrc
      - app/**
      - build.gradle.kts
      - ci/script/download_android_dependencies.sh
      - ci/script/prepare_android_dependencies.py
      - cmake/**
      - avator/**
      - examples/**
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - llm/**
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - pnpm-workspace.yaml
      - quickjs/**
      - settings.gradle.kts
      - showerclient/**
      - terminal/**
      - terminal
      - tools/native_ripgrep/**
      - tools/packages_whitelist.txt
      - tools/example_packages/sync_example_packages.py
      - web-chat/**

concurrency:
  group: android-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '27.0.12077973'
  # CMake ≥ 3.24 是 Vulkan 后端 find_package(Vulkan COMPONENTS glslc) 的硬性要求。
  # ubuntu-24.04 runner 系统预装 CMake 3.31.6，下方通过 cmake.dir 复用系统预装版本，
  # 不再走 sdkmanager 安装（sdkmanager 仓库无 3.24.x / 3.31.6 精确 micro 版本）。
  ANDROID_CMAKE_VERSION: '3.31.6'
  ANDROID_API_LEVEL: '26'
  RUST_VERSION: '1.88.0'
  MANUAL_DEPS_DIR: manual-deps
  # GitHub ubuntu-24.04 runner 提供 16GB 内存。gradle.properties 中的
  # -Xmx8192m + parallel + workers.max=16 是为开发机（大内存）调优的，
  # 在 16GB runner 上叠加 KAPT(Room/ObjectBox) 与 CMake native 编译会突破
  # 内存上限，被 runner 的 OOM 看门狗 SIGTERM 终止（进程退出码 143，
  # 表现即上一轮的 "Run Gradle build" 失败——错误信息为空，因为没有构建错误）。
  # 故在此为 CI 单独收紧内存与并发参数，不改动 gradle.properties 以免影响本地开发。
  GRADLE_BUILD_JVMARGS: '-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
  GRADLE_BUILD_WORKERS: '4'

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Initialize terminal submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- terminal
          git submodule update --init --recursive --depth 1 terminal
          git submodule status -- terminal

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          # CMake 不通过 sdkmanager 安装：sdkmanager 仓库无 3.24.x / 3.31.6 精确 micro 版本，
          # 而 Vulkan 后端要求 CMake ≥ 3.24（FindVulkan glslc 组件语法）。下方 Configure 步骤
          # 通过 local.properties 的 cmake.dir 复用 ubuntu-24.04 runner 系统预装的 CMake 3.31.6。
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION"
          # 安装 glslc（Vulkan 着色器编译器）。NDK 自带的 glslc 路径在不同版本间有差异，
          # 直接装系统包确保 find_program 的 /usr/bin 路径能命中。
          sudo apt-get update
          sudo apt-get install -y glslc
          glslc --version
          # 校验系统预装 CMake 版本，确保 ≥ 3.24 且与 build.gradle.kts 的 version 字段一致
          CMAKE_REAL_PATH=$(readlink -f "$(command -v cmake)")
          echo "Resolved system cmake: $CMAKE_REAL_PATH"
          cmake --version | head -n 1

      - name: Restore Android CMake source cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            **/.cxx/operit_deps/*-src
          key: android-cmake-sources-${{ runner.os }}-${{ runner.arch }}-arm64-v8a-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt', '**/*.cmake', '**/build.gradle.kts', 'gradle.properties') }}

      - name: Restore Android dependency cache
        id: cache-manual-deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MANUAL_DEPS_DIR }}
          key: android-full-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Restore generated STT asset cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/build/generated/stt-model-assets
          key: stt-model-assets-${{ runner.os }}-${{ hashFiles('app/config/stt-model-assets.properties') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "$MANUAL_DEPS_DIR"

      - name: Prepare Android dependencies
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "$MANUAL_DEPS_DIR" \
            --repository "$GITHUB_WORKSPACE"

      - name: Restore native ripgrep cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native_ripgrep/target
          key: native-ripgrep-arm64-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API_LEVEL }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('tools/native_ripgrep/Cargo.toml', 'tools/native_ripgrep/Cargo.lock', 'tools/native_ripgrep/**/*.rs', 'tools/native_ripgrep/build_native_ripgrep.ps1') }}

      - name: Build native ripgrep
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
          cargo "+$RUST_VERSION" build \
            --manifest-path tools/native_ripgrep/Cargo.toml \
            --release \
            --target aarch64-linux-android \
            --locked
          install -Dm755 \
            tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
            app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          test -s app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Build WebChat assets
        run: |
          npm run build:webchat

      - name: Build bundled ToolPkg packages
        run: |
          npm run build:examples:github
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # NDK 版本由 app/build.gradle.kts 的 ndkVersion=27.0.12077973 锁定，
          # 与 SDK 预装版本一致，无需在 local.properties 指定 ndk.dir。
          # 复用系统预装 CMake 3.31.6（≥ 3.24，支持 Vulkan FindVulkan glslc 组件）。
          # cmake.dir 指向包含 bin/cmake 的目录的父目录，AGP 会优先使用它而非 SDK Manager 的版本。
          CMAKE_REAL_PATH=$(readlink -f "$(command -v cmake)")
          CMAKE_BIN_DIR=$(dirname "$CMAKE_REAL_PATH")
          CMAKE_TOP_DIR=$(dirname "$CMAKE_BIN_DIR")
          echo "cmake.dir=$CMAKE_TOP_DIR" >> local.properties
          cat local.properties

      - name: Setup fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          # ★ v1.0.1g: 使用固定的 debug keystore，避免每次编译签名变化导致需重装 APK
          # 从 GitHub Secrets 读取 base64 编码的 keystore 并解码
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          ls -lh ~/.android/debug.keystore

      - name: Run Gradle build
        env:
          DISPATCH_GRADLE_TASK: ${{ inputs.gradle_task }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push) gradle_task=assembleDebug ;;
            workflow_dispatch) gradle_task="$DISPATCH_GRADLE_TASK" ;;
            *) echo "Unsupported workflow event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          chmod +x ./gradlew
          # 内存与并发参数覆盖说明（均已本地实证）：
          #   -Dorg.gradle.jvmargs    -> 堆上限 8192m -> 6144m（Runtime.maxMemory 实测覆盖生效）
          #   -Dorg.gradle.workers.max-> 并行度 16 -> 4（startParameter.maxWorkerCount 实测）
          # 取值依据：16GB runner 上 6G 堆 + 4 路 worker（各约 1.5-2G）≈ 14G，留出安全余量。
          #   --no-parallel           -> 官方开关，关闭跨项目并行（优先级高于 gradle.properties）
          # 命令行参数优先级高于 gradle.properties，因此不修改该文件，避免影响本地开发。
          ./gradlew "$gradle_task" \
            --stacktrace \
            --no-daemon \
            --no-parallel \
            -Dorg.gradle.jvmargs="$GRADLE_BUILD_JVMARGS" \
            -Dorg.gradle.workers.max="$GRADLE_BUILD_WORKERS"

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operit-android-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload successful Android outputs
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: operit-android-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
